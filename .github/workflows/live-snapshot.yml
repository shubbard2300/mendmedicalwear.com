name: Snapshot live site files
# Temporary workflow (v2): recovers image binaries that exist only on the
# archived June-19 Vercel deployment, using a temporary share token to pass
# Vercel deployment protection. Files are written straight into the repo
# root. Delete this workflow after use.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/mendmedical-wear-status-rq65fx

      - name: Download archived deployment binaries
        run: |
          set -u
          BASE="https://mend-medical-nqyq3iq1b-gamecat2300-6951s-projects.vercel.app"
          SHARE="eicilpKyghFlNE5uW3FY87mlZiMLsrC3"
          JAR="$(mktemp)"
          # Establish the protection-bypass cookie via the share link
          curl -fsSL -c "$JAR" -b "$JAR" "$BASE/?_vercel_share=$SHARE" -o /dev/null || true
          : > snapshot-manifest.txt
          download() {
            f="$1"
            url="$BASE/${f// /%20}"
            if curl -fsSL -b "$JAR" -c "$JAR" --retry 2 --max-time 90 -o "$f" "$url"; then
              # Guard against auth HTML masquerading as an image
              if file "$f" | grep -qiE 'image|icon|data'; then
                echo "OK   $f" >> snapshot-manifest.txt
              else
                echo "BAD  $f ($(file -b "$f" | head -c 40))" >> snapshot-manifest.txt
                rm -f "$f"
              fi
            else
              echo "MISS $f" >> snapshot-manifest.txt
              rm -f "$f"
            fi
          }
          while IFS= read -r f; do
            [ -n "$f" ] && download "$f"
          done <<'EOF'
          favicon.ico
          favicon-16x16.png
          favicon-32x32.png
          Concept - AirGuard Collar - 2026-06-17-web.jpg
          Concept - Nurse Scrubs - Female Front - Navy - 2026-06-17-web.jpg
          Concept - Nurse Scrubs - Female Back - Navy - 2026-06-17-web.jpg
          Concept - Nurse Scrubs - Male Front - Navy - 2026-06-17-web.jpg
          Concept - Nurse Scrubs - Male Back - Navy - 2026-06-17-web.jpg
          Concept - Nurse Scrubs - Female Front - Charcoal - 2026-06-17-web.jpg
          Concept - Nurse Scrubs - Female Back - Charcoal - 2026-06-17-web.jpg
          Concept - Nurse Scrubs - Male Front - Charcoal - 2026-06-17-web.jpg
          Concept - Nurse Scrubs - Male Back - Charcoal - 2026-06-17-web.jpg
          Concept - Nurse Scrubs - Female Front - Ceil Blue - 2026-06-17-web.jpg
          Concept - Nurse Scrubs - Female Back - Ceil Blue - 2026-06-17-web.jpg
          Concept - Nurse Scrubs - Male Front - Ceil Blue - 2026-06-17-web.jpg
          Concept - Nurse Scrubs - Male Back - Ceil Blue - 2026-06-17-web.jpg
          Concept - Compression Socks - Sage - 2026-06-18-web.jpg
          Concept - Compression Socks - Charcoal - 2026-06-18-web.jpg
          Concept - Compression Socks - Heather Grey - 2026-06-18-web.jpg
          Concept - Compression Socks - Black - 2026-06-18-web.jpg
          Concept - Compression Socks - Non-Slip Sole Detail - 2026-06-18-web.jpg
          Concept - Compression Socks - Non-Slip Worn - 2026-06-18-web.jpg
          Concept - Compression Socks - Webbing Detail - 2026-06-18-web.jpg
          EOF
          cat snapshot-manifest.txt

      - name: Commit recovered files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Recover archived-deployment images into repo root" || echo "nothing to commit"
          git push
