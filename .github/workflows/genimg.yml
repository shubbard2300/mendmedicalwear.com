name: Generate product photography
# Temporary workflow: generates photorealistic model shots for MEND Pulse and
# MEND Oxi via the free pollinations.ai image API (Flux), and commits them to
# the branch for review. Delete after use.

on:
  push:
    branches: [claude/mendmedical-wear-status-rq65fx]
    paths: ['.github/workflows/genimg.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/mendmedical-wear-status-rq65fx

      - name: Generate images
        run: |
          python3 - <<'EOF'
          import urllib.parse, urllib.request, time, os
          os.makedirs("gen", exist_ok=True)

          BASE = "https://image.pollinations.ai/prompt/"

          shots = [
            ("gen/pulse-a.jpg", 1152, 1152, 101,
             "photorealistic lifestyle photograph, woman in her 40s at a bright kitchen table, a white inflatable blood pressure cuff is wrapped snugly around her bare upper arm above the elbow exactly like at a doctors office, the fabric band fully encircles her arm, a small white monitor unit sits on the cuff, her hands rest calmly on the table, relaxed soft smile, natural window light, editorial medical advertising photography, 35mm"),
            ("gen/pulse-b.jpg", 1152, 1152, 202,
             "professional advertising photograph of a woman measuring her blood pressure at home, white upper arm blood pressure cuff wrapped around her left upper arm, band encircling the arm above the elbow, compact white device attached to the cuff showing 118 over 76, she sits at a wooden table with coffee, warm morning light, photorealistic, shallow depth of field"),
            ("gen/pulse-c.jpg", 832, 1248, 303,
             "vertical photorealistic photo, smiling woman seated sideways showing her upper arm with a white blood pressure cuff wrapped around it like a sleeve band, small screen on the cuff glowing 118/76, bright scandinavian kitchen behind her, natural light, editorial healthcare photography"),
            ("gen/oxi-a.jpg", 1152, 1152, 404,
             "photorealistic photograph, silver haired man in his 70s in an armchair, a small white fingertip pulse oximeter is clipped onto the end of his index finger, his fingertip is inserted inside the clip like a clothespin covering the fingertip, tiny screen shows 98, he smiles gently at his hand, golden hour living room light, medical advertising photography"),
            ("gen/oxi-b.jpg", 1152, 1152, 505,
             "professional healthcare advertising photo, close view of an older mans hand with a white clip-style pulse oximeter clamped over his index fingertip, the finger disappears inside the small white device, display reads SpO2 98, his warm smiling face soft in the background, sunlit living room, photorealistic, 50mm"),
            ("gen/oxi-c.jpg", 832, 1248, 606,
             "vertical photorealistic photo, older woman with grey curly hair in a warm cardigan seated by a window, small white pulse oximeter clipped on her index fingertip with the fingertip inside the device, screen glowing 98, she looks at it reassured, soft daylight, editorial healthcare photography"),
          ]

          for fname, w, h, seed, prompt in shots:
            url = BASE + urllib.parse.quote(prompt) + f"?width={w}&height={h}&model=flux&nologo=true&seed={seed}"
            for attempt in range(4):
                try:
                    req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                    data = urllib.request.urlopen(req, timeout=300).read()
                    if len(data) > 30000 and (data[:3] == b'\xff\xd8\xff' or data[:8] == b'\x89PNG\r\n\x1a\n'):
                        open(fname, "wb").write(data)
                        print("OK ", fname, len(data))
                        break
                    print("BAD payload", fname, len(data))
                except Exception as e:
                    print("ERR", fname, attempt, e)
                time.sleep(20)
            else:
                print("FAILED", fname)
          EOF

      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Model photography round 2: device worn on body, multiple variants" || echo "nothing to commit"
          git push
