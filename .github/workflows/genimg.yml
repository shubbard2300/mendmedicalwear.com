name: Generate product photography
# Temporary workflow: generates photorealistic model shots for MEND Pulse and
# MEND Oxi via the free pollinations.ai image API (Flux), and commits them to
# the branch for review. Delete after use.

on:
  push:
    branches: [claude/mendmedical-wear-status-rq65fx]
    paths: ['.github/workflows/genimg.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/mendmedical-wear-status-rq65fx

      - name: Generate images
        run: |
          python3 - <<'EOF'
          import urllib.parse, urllib.request, time, os
          os.makedirs("gen", exist_ok=True)

          BASE = "https://image.pollinations.ai/prompt/"

          shots = [
            ("gen/p1.jpg", 1152, 1152, 11,
             "professional stock photo, smiling middle aged woman sitting at kitchen table using an omron style automatic digital blood pressure monitor, white fabric cuff wrapped around her upper arm connected by tube to a small white monitor on the table with digital display reading 118 76, morning light, photorealistic, healthcare advertising"),
            ("gen/p2.jpg", 1152, 1152, 22,
             "photorealistic healthcare photo, home health nurse measuring blood pressure of a smiling senior woman using an automatic upper arm blood pressure cuff, white cuff wrapped around the patients upper arm, digital monitor showing reading, bright living room, natural light, editorial"),
            ("gen/p3.jpg", 832, 1248, 33,
             "stock photography, woman checking her blood pressure at home with digital upper arm monitor, cuff on upper arm, display showing 118 over 76, seated at wooden table with coffee cup, soft window light, vertical composition, photorealistic"),
            ("gen/p4.jpg", 832, 1248, 44,
             "photorealistic vertical photo, close up of female arm with white blood pressure cuff wrapped around upper arm, small digital monitor showing 118 76, blurred bright kitchen background with smiling woman, healthcare product photography"),
            ("gen/o1.jpg", 1152, 1152, 55,
             "professional stock photo, fingertip pulse oximeter clipped on an elderly mans index finger, red led light glowing inside the clip, small display showing 98, closeup of his hand resting on armchair with his warm smiling face softly blurred behind, photorealistic, healthcare"),
            ("gen/o2.jpg", 1152, 1152, 66,
             "photorealistic medical photo, hand of senior patient with white pulse oximeter clamped on index finger measuring oxygen saturation, oximeter display reads 98 SpO2, warm home setting, shallow depth of field, stock photography"),
            ("gen/o3.jpg", 832, 1248, 77,
             "stock photography vertical, elderly woman with silver curly hair smiling while a fingertip pulse oximeter is clipped on her finger, display showing 98, cozy cardigan, seated by bright window, photorealistic healthcare advertising"),
            ("gen/o4.jpg", 832, 1248, 88,
             "photorealistic vertical closeup, mans hand with a classic white fingertip pulse oximeter device clipped over the index finger like a clothespin, screen shows 98, soft sunlit living room bokeh background, product photography"),
          ]

          for fname, w, h, seed, prompt in shots:
            url = BASE + urllib.parse.quote(prompt) + f"?width={w}&height={h}&model=flux&nologo=true&seed={seed}"
            for attempt in range(4):
                try:
                    req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                    data = urllib.request.urlopen(req, timeout=300).read()
                    if len(data) > 30000 and (data[:3] == b'\xff\xd8\xff' or data[:8] == b'\x89PNG\r\n\x1a\n'):
                        open(fname, "wb").write(data)
                        print("OK ", fname, len(data))
                        break
                    print("BAD payload", fname, len(data))
                except Exception as e:
                    print("ERR", fname, attempt, e)
                time.sleep(20)
            else:
                print("FAILED", fname)
          EOF

      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Model photography round 3: category-familiar prompts" || echo "nothing to commit"
          git push
