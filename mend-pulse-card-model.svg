<svg viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Woman wearing the MEND Pulse blood pressure cuff on her upper arm, reading 118 over 76">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#EEF4FB"/><stop offset="1" stop-color="#DCE9F7"/>
    </linearGradient>
    <linearGradient id="dev" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#FDFDFC"/><stop offset="1" stop-color="#E9EBEA"/>
    </linearGradient>
    <linearGradient id="scr" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#141E28"/><stop offset="1" stop-color="#0A0F14"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#bg)"/>
  <circle cx="200" cy="260" r="210" fill="#FFFFFF" opacity="0.45"/>
  <circle cx="58" cy="92" r="6" fill="#BFD7F0"/><circle cx="352" cy="140" r="7" fill="#9EC9E8"/><circle cx="330" cy="500" r="6" fill="#CFE0F4"/>

  <!-- torso -->
  <path d="M96 600c0-118 4-176 30-204 22-24 52-34 74-34s52 10 74 34c26 28 30 86 30 204z" fill="#7FB3D9"/>
  <path d="M176 372l24 26 24-26" fill="none" stroke="#5E93BF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- head -->
  <path d="M138 208c0-40 28-68 62-68 36 0 62 28 62 68v24c0 36-27 60-62 60s-62-24-62-60z" fill="#E8C4A8"/>
  <path d="M132 226c-8-56 26-94 68-94 40 0 72 34 66 90-2 22-8 30-8 30 2-30-5-42-15-54-22 5-54 2-70-15-10 15-22 22-29 27 0 0-8 26-3 42 0 0-7-8-9-26z" fill="#3A3F47"/>
  <path d="M262 250c5 32-5 54-20 68 25-5 38-27 35-54z" fill="#3A3F47"/>
  <circle cx="141" cy="242" r="10" fill="#E0B698"/>
  <path d="M188 252c4 5 10 5 14 0" fill="none" stroke="#B98A66" stroke-width="4" stroke-linecap="round"/>
  <path d="M180 278c8 6 20 6 28 0" fill="none" stroke="#B98A66" stroke-width="5" stroke-linecap="round"/>
  <path d="M164 234l13-3M222 231l13 3" stroke="#3A3F47" stroke-width="5" stroke-linecap="round"/>
  <circle cx="172" cy="248" r="4.2" fill="#3A3F47"/><circle cx="228" cy="248" r="4.2" fill="#3A3F47"/>
  <circle cx="162" cy="268" r="7" fill="#F0A8A0" opacity="0.5"/><circle cx="238" cy="268" r="7" fill="#F0A8A0" opacity="0.5"/>

  <!-- left arm raised across, wearing cuff -->
  <path d="M282 408c34 22 46 56 40 96-4 28-20 48-42 56" fill="none" stroke="#6FA6D1" stroke-width="46" stroke-linecap="round"/>
  <circle cx="278" cy="564" r="21" fill="#E8C4A8"/>

  <!-- cuff + device -->
  <g transform="rotate(18 310 452)">
    <rect x="272" y="414" width="76" height="84" rx="18" fill="#EDF1F5"/>
    <rect x="272" y="414" width="76" height="84" rx="18" fill="none" stroke="#D5DEE8" stroke-width="4"/>
    <rect x="281" y="422" width="58" height="70" rx="15" fill="url(#dev)"/>
    <rect x="289" y="430" width="42" height="34" rx="9" fill="url(#scr)"/>
    <text x="310" y="446" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#EAF6FF">118</text>
    <text x="310" y="459" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" fill="#7FB4D6">/ 76</text>
    <circle cx="310" cy="477" r="8.5" fill="#F2F3F2" stroke="#D6DAD8" stroke-width="1.4"/>
    <circle cx="310" cy="477" r="12.5" fill="none" stroke="#3FA8E0" stroke-width="2.4" opacity="0.6"/>
  </g>

  <!-- caption chip -->
  <g>
    <rect x="86" y="40" width="228" height="34" rx="17" fill="#FFFFFF" opacity="0.9"/>
    <text x="200" y="62" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#1B2430">MEND Pulse · 118/76 synced ✓</text>
