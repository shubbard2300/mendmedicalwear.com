<svg viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MEND Pulse wireless blood pressure monitor">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#12263A"/>
      <stop offset="1" stop-color="#0B1B2B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.65">
      <stop offset="0" stop-color="#3FA8E0" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#2E6BE6" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#2E6BE6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#FDFDFC"/>
      <stop offset="0.55" stop-color="#F1F2F1"/>
      <stop offset="1" stop-color="#E7E9E8"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#141E28"/>
      <stop offset="1" stop-color="#0A0F14"/>
    </linearGradient>
  </defs>

  <rect width="400" height="600" fill="url(#bg)"/>
  <rect width="400" height="600" fill="url(#glow)"/>

  <!-- device -->
  <g>
    <rect x="105" y="120" width="190" height="330" rx="58" fill="url(#body)"/>
    <rect x="105.75" y="120.75" width="188.5" height="328.5" rx="57.25" fill="none" stroke="#FFFFFF" stroke-opacity="0.65" stroke-width="1.5"/>
    <!-- smoked glass screen -->
    <rect x="140" y="152" width="120" height="160" rx="26" fill="url(#screen)"/>
    <text x="200" y="222" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="40" font-weight="600" fill="#EAF6FF">118</text>
    <text x="200" y="254" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="22" fill="#7FB4D6">/ 76</text>
    <circle cx="178" cy="281" r="4" fill="#3FA8E0"/>
    <text x="212" y="286" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#5E88A5">62 bpm</text>
    <!-- halo button -->
    <circle cx="200" cy="392" r="27" fill="#F2F3F2"/>
    <circle cx="200" cy="392" r="27" fill="none" stroke="#D6DAD8" stroke-width="1"/>
    <circle cx="200" cy="392" r="33" fill="none" stroke="#3FA8E0" stroke-opacity="0.55" stroke-width="2"/>
    <!-- seam -->
    <rect x="145" y="431" width="110" height="5" rx="2.5" fill="#D3D7D5"/>
  </g>

  <!-- caption -->
  <text x="200" y="505" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#F4F8FC" letter-spacing="0.5">MEND Pulse</text>
  <text x="200" y="532" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#8FB4D9" letter-spacing="2.5">WIRELESS BLOOD PRESSURE MONITOR</text>
  <text x="200" y="560" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#5E7690">Healthcare, Connected.</text>
</svg>
