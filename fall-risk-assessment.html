          <h1 class="fr-title">How likely is a fall — and what would change it?</h1>
          <p class="fr-lede">
            This check needs JavaScript to score your answers in the browser. The questions
            come from the CDC’s STEADI “Stay Independent” screener, which you can complete on
            paper instead: a score of 4 or more out of 14 is the point at which clinicians
            begin screening for falls.
          </p>
          <p class="fr-note">
            Whatever your score, two things help almost everyone — asking a pharmacist to
            review every medicine you take, including anything over the counter, and getting
            your eyes checked once a year.
