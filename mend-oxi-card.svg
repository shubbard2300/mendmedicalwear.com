<svg viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Man wearing the MEND Oxi fingertip pulse oximeter, showing an SpO2 reading of 98 percent">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#EEF4FB"/><stop offset="1" stop-color="#DDEDF3"/>
    </linearGradient>
    <linearGradient id="dev2" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#FDFDFC"/><stop offset="1" stop-color="#E9EBEA"/>
    </linearGradient>
    <linearGradient id="scr2" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#141E28"/><stop offset="1" stop-color="#0A0F14"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#bg2)"/>
  <circle cx="200" cy="270" r="210" fill="#FFFFFF" opacity="0.45"/>
  <circle cx="60" cy="110" r="6" fill="#BFD7F0"/><circle cx="348" cy="90" r="7" fill="#9EC9E8"/><circle cx="344" cy="520" r="6" fill="#CFE0F4"/>

  <!-- torso: sage-teal sweater for family palette variety -->
  <path d="M92 600c0-116 6-172 32-200 22-24 52-34 76-34s54 10 76 34c26 28 32 84 32 200z" fill="#6FA9A0"/>
  <path d="M178 378l22 24 22-24" fill="none" stroke="#578E85" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- head: older man, darker skin tone, silver hair -->
  <path d="M140 214c0-40 26-66 60-66 36 0 60 26 60 66v22c0 36-26 60-60 60s-60-24-60-60z" fill="#9C6B4A"/>
  <path d="M134 224c-6-50 24-88 66-88 40 0 68 34 64 84-1 12-4 20-7 25 1-26-6-38-14-48-22 5-52 2-68-14-10 14-21 21-28 25 0 0-8 20-4 38-3-4-7-12-9-22z" fill="#D8DCDF"/>
  <circle cx="143" cy="246" r="10" fill="#8F5F40"/>
  <path d="M190 256c4 5 10 5 14 0" fill="none" stroke="#7A4E32" stroke-width="4" stroke-linecap="round"/>
  <path d="M182 282c8 7 20 7 28 0" fill="none" stroke="#7A4E32" stroke-width="5" stroke-linecap="round"/>
  <path d="M166 238l13-3M224 235l13 3" stroke="#D8DCDF" stroke-width="5" stroke-linecap="round"/>
  <circle cx="174" cy="252" r="4.2" fill="#3A3F47"/><circle cx="230" cy="252" r="4.2" fill="#3A3F47"/>

  <!-- raised hand with oximeter on index finger -->
  <g>
    <path d="M296 588c-8-48-6-86 6-108" fill="none" stroke="#6FA9A0" stroke-width="46" stroke-linecap="round"/>
    <!-- hand -->
    <path d="M280 456c-4-24 4-44 20-50 6-2 12-2 18 0l4 2c14 6 20 24 16 46-3 18-14 30-29 30s-26-11-29-28z" fill="#9C6B4A"/>
    <!-- index finger up -->
    <rect x="296" y="360" width="26" height="72" rx="13" fill="#9C6B4A"/>
    <!-- oximeter clipped on finger -->
    <g>
      <rect x="284" y="342" width="50" height="58" rx="14" fill="url(#dev2)"/>
      <rect x="284" y="342" width="50" height="58" rx="14" fill="none" stroke="#D6DAD8" stroke-width="2"/>
      <rect x="291" y="349" width="36" height="30" rx="7" fill="url(#scr2)"/>
      <text x="309" y="364" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#5EEAD4">98<tspan font-size="7" fill="#7FB4D6">%</tspan></text>
      <text x="309" y="374" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="6.5" letter-spacing="1" fill="#5E88A5">SpO2 · 62</text>
      <rect x="296" y="385" width="26" height="9" rx="4.5" fill="none" stroke="#3FA8E0" stroke-width="1.6" opacity="0.6"/>
    </g>
  </g>

  <!-- caption chip -->
  <g>
    <rect x="82" y="40" width="236" height="34" rx="17" fill="#FFFFFF" opacity="0.9"/>
    <text x="200" y="62" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#1B2430">MEND Oxi · SpO₂ 98% synced ✓</text>
  </g>
</svg>
