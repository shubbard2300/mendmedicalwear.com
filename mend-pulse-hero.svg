<svg viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of a woman seated at her kitchen table taking a blood pressure reading with the MEND Pulse cuff on her upper arm while the reading syncs to her phone">
  <defs>
    <radialGradient id="halo" cx="0.5" cy="0.44" r="0.62">
      <stop offset="0" stop-color="#3FA8E0" stop-opacity="0.20"/>
      <stop offset="0.65" stop-color="#2E6BE6" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#2E6BE6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cuffdev" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#FDFDFC"/>
      <stop offset="1" stop-color="#E9EBEA"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#141E28"/>
      <stop offset="1" stop-color="#0A0F14"/>
    </linearGradient>
  </defs>

  <!-- ambient -->
  <circle cx="320" cy="290" r="290" fill="url(#halo)"/>
  <circle cx="96" cy="130" r="7" fill="#BFD7F0"/>
  <circle cx="560" cy="112" r="5" fill="#9EC9E8"/>
  <circle cx="586" cy="360" r="8" fill="#CFE0F4"/>
  <circle cx="60" cy="420" r="5" fill="#CFE0F4"/>

  <!-- window suggestion -->
  <rect x="380" y="66" width="180" height="150" rx="18" fill="#EAF2FB"/>
  <rect x="380" y="66" width="180" height="150" rx="18" fill="none" stroke="#DBE7F4" stroke-width="3"/>
  <line x1="470" y1="70" x2="470" y2="212" stroke="#DBE7F4" stroke-width="3"/>
  <path d="M398 150c14-18 34-16 44-4 10-14 30-12 38 2" fill="none" stroke="#C9DCF2" stroke-width="4" stroke-linecap="round"/>

  <!-- plant -->
  <g>
    <path d="M96 336c-4-34 8-58 26-72" fill="none" stroke="#7FAF9B" stroke-width="6" stroke-linecap="round"/>
    <path d="M100 322c-20-8-30-26-30-44 18 2 32 16 34 32" fill="#9CC4B2"/>
    <path d="M104 300c2-22 14-36 30-42 2 18-8 34-22 42" fill="#B4D4C6"/>
    <path d="M78 336h48l-6 44c-1 7-6 10-12 10h-12c-6 0-11-3-12-10z" fill="#E3D9C8"/>
  </g>

  <!-- table -->
  <rect x="120" y="392" width="470" height="16" rx="8" fill="#E4D8C4"/>
  <rect x="150" y="408" width="14" height="150" rx="7" fill="#D9CCB4"/>
  <rect x="540" y="408" width="14" height="150" rx="7" fill="#D9CCB4"/>

  <!-- coffee -->
  <g>
    <rect x="196" y="352" width="52" height="42" rx="10" fill="#FFFFFF"/>
    <rect x="196" y="352" width="52" height="42" rx="10" fill="none" stroke="#E2E8F0" stroke-width="3"/>
    <path d="M248 362h12a10 10 0 010 20h-12" fill="none" stroke="#E2E8F0" stroke-width="6" stroke-linecap="round"/>
    <path d="M212 340c0-6 6-6 6-12M228 340c0-6 6-6 6-12" stroke="#C9D6E6" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>

  <!-- phone propped on table, sync screen -->
  <g>
    <rect x="470" y="298" width="58" height="98" rx="12" fill="#0D1620"/>
    <rect x="475" y="304" width="48" height="86" rx="8" fill="#F4F8FD"/>
    <rect x="481" y="314" width="36" height="22" rx="5" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <text x="499" y="330" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#1B2430">118/76</text>
    <rect x="481" y="342" width="36" height="8" rx="4" fill="#DCE8F6"/>
    <rect x="481" y="355" width="26" height="8" rx="4" fill="#DCE8F6"/>
    <circle cx="499" cy="376" r="9" fill="#E5F5EC"/>
    <path d="M494.5 376l3.2 3.2 6-6.6" fill="none" stroke="#177E4D" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- sync arc: device to phone -->
  <path d="M352 268c48-36 96-16 128 30" fill="none" stroke="#3FA8E0" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="1 12" opacity="0.9"/>

  <!-- ── person ── -->
  <!-- chair -->
  <rect x="196" y="300" width="20" height="258" rx="10" fill="#8FA0B3"/>
  <rect x="188" y="546" width="150" height="14" rx="7" fill="#8FA0B3"/>

  <!-- legs -->
  <path d="M258 430c-2 44-4 74-6 106 0 6 4 10 10 10h16c6 0 10-4 10-9l4-104z" fill="#1E4FC2"/>
  <path d="M300 430l6 104c0 5 5 9 10 9h16c6 0 10-4 10-10-2-32-4-61-6-103z" fill="#2455C9"/>
  <ellipse cx="276" cy="552" rx="26" ry="10" fill="#12263A"/>
  <ellipse cx="330" cy="552" rx="26" ry="10" fill="#12263A"/>

  <!-- torso -->
  <path d="M246 296c0-34 26-58 60-58s62 24 62 58l-4 96c-1 22-16 38-38 38h-40c-22 0-38-16-39-38z" fill="#7FB3D9"/>
  <!-- collar -->
  <path d="M290 242l16 18 16-18" fill="none" stroke="#5E93BF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- resting forearm on table (person's right arm, near side) -->
  <path d="M258 306c-16 26-18 52-10 74 6 14 20 20 34 16l40-12" fill="none" stroke="#7FB3D9" stroke-width="34" stroke-linecap="round"/>
  <circle cx="326" cy="382" r="15" fill="#E8C4A8"/>

  <!-- head -->
  <g>
    <path d="M262 176c0-30 22-52 50-52 30 0 50 22 50 52v20c0 28-22 48-50 48s-50-20-50-48z" fill="#E8C4A8"/>
    <!-- hair -->
    <path d="M258 190c-6-44 22-74 56-74 32 0 58 26 54 70-2 20-8 26-8 26 2-24-4-34-12-44-18 4-44 2-58-12-8 12-18 18-24 22 0 0-6 22-2 34 0 0-5-6-6-22z" fill="#3A3F47"/>
    <path d="M362 210c4 26-4 44-16 56 20-4 30-22 28-44z" fill="#3A3F47"/>
    <!-- ear -->
    <circle cx="264" cy="204" r="9" fill="#E0B698"/>
    <!-- calm face -->
    <path d="M306 214c3 4 8 4 11 0" fill="none" stroke="#B98A66" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M300 236c6 5 16 5 22 0" fill="none" stroke="#B98A66" stroke-width="4" stroke-linecap="round"/>
    <path d="M286 200l10-2M330 198l10 2" stroke="#3A3F47" stroke-width="4" stroke-linecap="round"/>
    <circle cx="292" cy="212" r="3.4" fill="#3A3F47"/>
    <circle cx="336" cy="212" r="3.4" fill="#3A3F47"/>
    <circle cx="284" cy="228" r="6" fill="#F0A8A0" opacity="0.5"/>
    <circle cx="344" cy="228" r="6" fill="#F0A8A0" opacity="0.5"/>
  </g>

  <!-- far arm (left, wearing cuff) raised slightly, hand near lap -->
  <path d="M356 300c22 18 30 42 26 68-3 20-16 34-34 38" fill="none" stroke="#6FA6D1" stroke-width="34" stroke-linecap="round"/>
  <circle cx="346" cy="408" r="15" fill="#E8C4A8"/>

  <!-- ── MEND Pulse cuff on upper arm ── -->
  <g>
    <!-- fabric cuff band wrapping the arm stroke -->
    <rect x="344" y="286" width="52" height="64" rx="14" fill="#EDF1F5" transform="rotate(24 370 318)"/>
    <rect x="344" y="286" width="52" height="64" rx="14" fill="none" stroke="#D5DEE8" stroke-width="3" transform="rotate(24 370 318)"/>
    <!-- device puck -->
    <g transform="rotate(24 372 318)">
      <rect x="350" y="292" width="42" height="54" rx="12" fill="url(#cuffdev)"/>
      <rect x="356" y="298" width="30" height="26" rx="7" fill="url(#screen)"/>
      <text x="371" y="310" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="600" fill="#EAF6FF">118</text>
      <text x="371" y="320" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="7.5" fill="#7FB4D6">/ 76</text>
      <circle cx="371" cy="334" r="6.5" fill="#F2F3F2" stroke="#D6DAD8" stroke-width="1"/>
      <circle cx="371" cy="334" r="9.5" fill="none" stroke="#3FA8E0" stroke-width="1.8" opacity="0.6"/>
    </g>
  </g>
</svg>
